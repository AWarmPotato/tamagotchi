<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamagotchi | in progress</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 

    <button id="reset-button">restart</button>

    <section id="start-screen">

        <div id="start-screen-top">
            <h3>Name picker</h3>
        </div>

        <div id="start-screen-middle">
            <label for="name-input">name your tamagotchi:</label>
            <input type="text" maxlength="15" id="name-input">
        </div>

        <div id="start-screen-bottom">
            <button id="start-button">Start game</button>
        </div>
    </section> 
    <p id="name-error" class="hidden">You entered an invalid name</p>


    <main id="console" class="hidden">
        <h1 id="pet-name"></h1>

        <div id="main-screen">
            <p>status: <span id="pet-status"></span></p>
            <img src="./images/tamogotchi-sprite.png" alt="pet" id="pet"> 

        </div>

        <div id="divider">

        </div>

        <section id="console-bottom">


        <div class="buttons-left">
            <button class="button-style" id="clean-button">A</button>
            <button class="button-style" id="medicine-button">B</button>
        </div>

        <div id="info-screen">
            <div class="stat"> 
                <p class="bar-text">hunger</p>
                <div class="bar">
                    <div id="hunger-bar" class="bar-fill"></div>
                    <span id="hunger-text" class="bar-percentage">%</span>
                </div>
            </div>

            <div class="stat"> 
                <p class="bar-text">happiness</p>
                <div class="bar">
                    <div id="happiness-bar" class="bar-fill"></div>
                    <span id="happiness-text" class="bar-percentage">%</span>
                </div>
            </div>

            <div class="stat"> 
                <p class="bar-text">health</p>
                <div class="bar">
                    <div id="health-bar" class="bar-fill"></div>
                    <span id="health-text" class="bar-percentage">%</span>
                </div>
            </div>

        </div>

        <div class="buttons-right">
            <button class="button-style" id="play-button">C</button>
            <button class="button-style" id="feed-button">D</button>
        </div>

        </section>

        <p>.  .  .</p>
    </main>
    

    <script src="script.js"></script>
</body>
</html>
